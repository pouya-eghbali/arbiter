# Copy to $XDG_CONFIG_HOME/arbiter/settings.toml (default ~/.config/arbiter/settings.toml).
# Restart Arbiter after editing. Omitted keys use shared or built-in defaults.
# UI changes save here; the TOML writer removes comments and normalizes ordering.

[appearance]
theme = "system"
navigationPill = true
# handle or edge; navigationPill=false gives shortcut-only navigation.
navigationRevealMode = "handle"
# Tabs corner: hover (clickable button), drag (diagonally down-left), or off.
pageEdgeMode = "hover"
# Compositor-backed trackpad/precision-scroll history navigation.
historySwipeEnabled = true
windowDecorations = false
siteMenuMode = "title"
lightAccent = "#2868b8"
darkAccent = "#8dbbff"
lightBackground = "#edf2f7"
darkBackground = "#11161e"
# Optional images for the start page and behind split views. Empty means color only.
# Paths can be relative to this file, absolute local paths, or file: URLs.
lightBackgroundImage = ""
darkBackgroundImage = ""

[AdBlock]
enabled = true

[Search]
# duckduckgo, google, bing, brave, ecosia, or startpage
engine = "duckduckgo"

[History]
enabled = true

[Tabs]
# Seconds of uninterrupted background inactivity; 0 disables sleeping. Maximum 86400.
sleepTimeout = 900

[Passwords]
enabled = true
biometricEnabled = true
# Seconds after successful fingerprint verification; 0 asks every time, maximum 3600.
verificationCooldown = 300

# Qt PortableText shortcuts: Ctrl means Command on macOS, Control elsewhere.
# Meta means Control on macOS. Shortcuts must be unique.
# Omit KeyboardBindings to use the platform's default shortcuts.
# [KeyboardBindings]
# address = "Ctrl+L"
# settings = "Ctrl+,"
# nextHiddenTab = "Ctrl+Alt+N"
# splitWith = "Ctrl+Alt+Shift+S"
# privateWindow = "Ctrl+Shift+N"
# lockPrivate = "Ctrl+Alt+L"
# pageTop = "Ctrl+Up"
# pageBottom = "Ctrl+Down"

# Setup state is saved automatically. Dotfile-managed installs can skip setup:
# [onboarding]
# version = 1
# tutorialPending = false

[Privacy]
geolocationEnabled = true # Sites must still ask for permission; false blocks all location requests.
# Lock private windows after this many seconds without keyboard, mouse, or touch input.
# Window deactivation, minimization, screen lock, and system sleep always lock immediately.
lockTimeout = 300
