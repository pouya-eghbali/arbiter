name: Desktop release
on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: Existing release tag matching VERSION.txt (e.g. v0.1.0 or v0.1.0-rc.1)
        type: string
        required: true
permissions:
  contents: read
concurrency:
  group: release-${{ inputs.tag || github.ref_name }}
  cancel-in-progress: false
jobs:
  validate:
    runs-on: ubuntu-24.04
    outputs:
      sha: ${{ steps.tag.outputs.sha }}
      tag: ${{ steps.tag.outputs.tag }}
      prerelease: ${{ steps.tag.outputs.prerelease }}
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0}
      - name: Validate immutable tag, release version, and trusted history
        id: tag
        env:
          TAG: ${{ inputs.tag || github.ref_name }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        shell: bash
        run: |
          python tools/release/validate_tag.py
      - run: python -m unittest discover -s engine -p 'test_*.py'
      - run: python -m unittest discover -s tools/release -p 'test_*.py'
  draft:
    needs: validate
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.validate.outputs.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Prepare a source-only draft for locally built packages
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ needs.validate.outputs.tag }}
          RELEASE_SHA: ${{ needs.validate.outputs.sha }}
          RELEASE_PRERELEASE: ${{ needs.validate.outputs.prerelease }}
        run: python tools/release/publish.py --prepare-only
