name: Website

on:
  push:
    paths: ['website/**', 'docs/privacy-policy.md', '.github/workflows/website.yml']
  pull_request:
    paths: ['website/**', 'docs/privacy-policy.md', '.github/workflows/website.yml']

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: website
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: website/package-lock.json
      - name: Check bundled privacy policy matches the app policy
        run: cmp ../docs/privacy-policy.md src/lib/privacy-policy.md
      - run: npm ci
      - run: npm run check
      - run: npm run build
      - uses: actions/upload-artifact@v7
        with:
          name: arbiter-website
          path: website/build/
