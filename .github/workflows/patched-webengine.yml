name: Patched Qt WebEngine SDK
on:
  workflow_dispatch:
    inputs:
      jobs:
        description: Nested Chromium jobs (24 requires a suitably sized builder)
        type: number
        default: 24
        required: true
permissions:
  contents: read
jobs:
  sdk:
    uses: ./.github/workflows/native-build.yml
    with:
      ref: ${{ github.sha }}
      jobs: ${{ inputs.jobs }}
