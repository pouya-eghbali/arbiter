name: Desktop checks

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: desktop-checks-${{ github.ref }}
  cancel-in-progress: true

jobs:
  desktop-tests:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            arch: clang_64
          - os: windows-latest
            arch: win64_msvc2022_64
          - os: ubuntu-24.04
            arch: linux_gcc_64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - name: Read dependency pins
        id: pins
        shell: bash
        run: |
          node - <<'JS'
          const fs = require('fs');
          const deps = JSON.parse(fs.readFileSync('dependencies.json', 'utf8'));
          const engine = JSON.parse(fs.readFileSync('engine/manifest.json', 'utf8'));
          const pins = {python: deps.python, rust: deps.rust, html5lib: deps.html5lib, qt: engine.qt};
          for (const [key, value] of Object.entries(pins)) fs.appendFileSync(process.env.GITHUB_OUTPUT, `${key}=${value}\n`);
          JS
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ steps.pins.outputs.python }}
      - uses: ilammy/msvc-dev-cmd@v1
        if: runner.os == 'Windows'
      - name: Install Linux runtime and keyring
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build libssl-dev libsecret-1-dev gnome-keyring dbus-x11 xvfb libnss3 libegl1 libopengl0 libxcb-cursor0 libxkbcommon-x11-0 libasound2t64
      - uses: jurplel/install-qt-action@v4
        with:
          # 3.3.0 predates the Qt 6.11+ Windows layout and standalone QtPdf packages.
          # Pin the upstream fix; this installs binaries, never builds WebEngine.
          aqtsource: git+https://github.com/miurahr/aqtinstall.git@076e1659807d0b362a3ed684d54c2e9c775eb9c7
          version: ${{ steps.pins.outputs.qt }}
          arch: ${{ matrix.arch }}
          modules: 'qtwebengine qtpdf qtwebchannel qtpositioning'
          setup-python: false
          cache: true
          cache-key-prefix: arbiter-qt-prebuilt-v2
      - name: Install Windows cryptography dependency
        if: runner.os == 'Windows'
        run: vcpkg install openssl:x64-windows
      - name: Configure Windows tests
        if: runner.os == 'Windows'
        run: cmake -S tests -B build-tests -G Ninja -DCMAKE_BUILD_TYPE=Release "-DCMAKE_TOOLCHAIN_FILE=$env:VCPKG_INSTALLATION_ROOT/scripts/buildsystems/vcpkg.cmake"
      - name: Configure macOS tests
        if: runner.os == 'macOS'
        run: cmake -S tests -B build-tests -G Ninja -DCMAKE_BUILD_TYPE=Release -DOPENSSL_ROOT_DIR="$(brew --prefix openssl@3)"
      - name: Configure Linux tests
        if: runner.os == 'Linux'
        run: cmake -S tests -B build-tests -G Ninja -DCMAKE_BUILD_TYPE=Release
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ steps.pins.outputs.rust }}
      - name: Test Rust ad-block engine
        run: cargo test --manifest-path rust/adblock/Cargo.toml --locked --release --jobs 4
      - name: Build tests
        run: cmake --build build-tests --parallel 4
      - name: Test macOS and Windows credential stores
        if: runner.os != 'Linux'
        env:
          ARBITER_TEST_KEYCHAIN: '1'
        run: ctest --test-dir build-tests --output-on-failure
      - name: Test Linux with a disposable Secret Service keyring
        if: runner.os == 'Linux'
        run: |
          # shellcheck disable=SC2016
          xvfb-run -a dbus-run-session -- bash -e -c '
            export GNOME_KEYRING_CONTROL
            GNOME_KEYRING_CONTROL=$(mktemp -d)
            printf "arbiter-ci-keyring" | gnome-keyring-daemon --unlock --components=secrets --control-directory="$GNOME_KEYRING_CONTROL"
            ARBITER_TEST_KEYCHAIN=1 ctest --test-dir build-tests --output-on-failure
          '
