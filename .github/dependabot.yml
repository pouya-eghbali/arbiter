version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule: {interval: weekly}
    groups:
      actions: {patterns: ['*']}
  - package-ecosystem: cargo
    directory: /rust/adblock
    schedule: {interval: weekly}
    groups:
      rust: {patterns: ['*']}
  - package-ecosystem: npm
    directory: /website
    schedule: {interval: weekly}
    groups:
      website: {patterns: ['*']}
