name: Bug report
description: Report something broken in Arbiter.
title: "[Bug]: "
body:
  - type: markdown
    attributes:
      value: |
        Thanks for helping improve Arbiter! Please search existing issues first.
        Issues are public. Remove passwords, cookies, tokens, personal URLs, and other private information from screenshots or logs.
        For a specific website or extension that does not work, use the Compatibility report form instead.
  - type: input
    id: version
    attributes:
      label: Arbiter version
      description: Find this in Settings → About. For a source build, include the commit if known.
      placeholder: "0.1.0"
    validations:
      required: true
  - type: dropdown
    id: operating-system
    attributes:
      label: Operating system
      options:
        - macOS
        - Windows
        - Linux
    validations:
      required: true
  - type: input
    id: system-version
    attributes:
      label: OS version and architecture
      placeholder: "macOS 15 / Apple Silicon, Windows 11 / x64, Ubuntu 24.04 / x86_64…"
  - type: textarea
    id: problem
    attributes:
      label: What happened?
      description: Describe the problem and what you expected to happen.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Open…
        2. Click…
        3. Observe…
    validations:
      required: true
  - type: textarea
    id: context
    attributes:
      label: Additional context
      description: Optional screenshots, sanitized logs, workarounds, or whether it happens with extensions disabled.
