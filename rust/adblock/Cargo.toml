[package]
name = "arbiter-adblock"
version = "0.1.0"
edition = "2024"
license = "GPL-3.0-only"

[lib]
crate-type = ["staticlib"]

[dependencies]
adblock = { version = "=0.13.3", default-features = false, features = ["embedded-domain-resolver", "full-regex-handling"] }
serde_json = "1"

[profile.release]
panic = "unwind"
lto = "thin"
